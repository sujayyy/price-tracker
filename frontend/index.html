<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f3d3e'/><path d='M7 16l5.2-6.2h11.3c.8 0 1.5.7 1.5 1.5v9.4c0 .8-.7 1.5-1.5 1.5H12.2Z' fill='none' stroke='%23f4f1ea' stroke-width='2' stroke-linejoin='round'/><circle cx='12.6' cy='16' r='1.6' fill='%23e9a91c'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1214" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint (no flash). "system" = follow the OS.
      try {
        var t = localStorage.getItem("priceops.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Price Tracker · Competitor pricing desk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
