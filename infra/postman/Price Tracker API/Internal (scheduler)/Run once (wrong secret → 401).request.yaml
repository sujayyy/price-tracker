$kind: http-request
description: "Negative check: the endpoint must reject a bad secret."
url: "{{base_url}}/internal/run-once"
method: POST
headers:
  X-Internal-Secret: wrong-secret
scripts:
  - type: afterResponse
    code: pm.test('status is 401', () => pm.expect(pm.response.code).to.be.oneOf([401]));
    language: text/javascript
order: 3000
