$kind: http-request
description: |-
  Stop fetching one competitor listing (it is also left out of the lowest-price comparison).
url: "{{base_url}}/api/listings/{{listing_id}}"
method: PATCH
headers:
  Content-Type: "application/json"
body:
  type: json
  content: |-
    {
      "active": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.expect(pm.response.code).to.be.oneOf([200]));
    language: text/javascript
order: 5000
